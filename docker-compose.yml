services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - API_PREFIX=/api/v1
      - CORS_ORIGIN=*
      - FASTAPI_AI_URL=http://ai-engine:8000
      - ENABLE_MONGODB=true
      - MONGODB_URI=mongodb://mongodb:27017/artistry_ai
      - JWT_SECRET=artistry_ai_super_secure_jwt_secret_change_in_production
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE_MB=25
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - artistry-net

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=*
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - artistry-net

  mongodb:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - artistry-net

volumes:
  backend-uploads:
  mongo-data:

networks:
  artistry-net:
    driver: bridge
